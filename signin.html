<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · 4VAGE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo"><a href="index.html"><img src="logo.png" alt="4VAGE" style="height:40px;"></a></div>
  <input type="checkbox" id="menu-toggle" class="menu-toggle">
  <label for="menu-toggle" class="hamburger">&#9776;</label>
  <nav class="side-nav">
    <a href="index.html">Brand</a>
    <a href="trending.html">Movies/Contents</a>
    <a href="partners.html">Fashion/Lifestyle</a>
    <a href="#">Events</a>
    <a href="careers.html">Career</a>
    <a href="about.html">About</a>
  </nav>
  <div class="auth-box">
    <a class="btn" href="signin.html">Sign In</a>
    <a class="btn filled" href="signup.html">Sign Up</a>
  </div>
</header>


<section>
  <h2>Sign In</h2>
  <form id="signin-form">
    <div>
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <div>
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button class="btn filled" type="submit">Sign In</button>
    <a href="#" style="font-size:0.85rem;color:var(--muted);">Forgot password?</a>
    <a href="signup.html" style="font-size:0.85rem;color:var(--gold);">New here? Sign up</a>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>
